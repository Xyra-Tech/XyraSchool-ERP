services:
  # ----------------------------------------------------------------------------
  # PostgreSQL (Primary Database Engine for Platform & School Tenants)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: xyratech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: xyratech_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis (Cache, Session Store & BullMQ Background Job Queue)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: xyratech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Platform API Service (Port 4000)
  # ----------------------------------------------------------------------------
  platform-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.platform-api
    container_name: xyratech-platform-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      PLATFORM_DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/xyratech_platform?schema=public"
      REDIS_URL: "redis://redis:6379"
      PLATFORM_JWT_SECRET: "xyratech-super-secure-platform-jwt-secret-phase1-dev-test"
      APP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # School Core API Service (Port 5000)
  # ----------------------------------------------------------------------------
  school-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.school-api
    container_name: xyratech-school-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DEFAULT_SCHOOL_DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/xyratech_school_dev?schema=public"
      PLATFORM_DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/xyratech_platform?schema=public"
      REDIS_URL: "redis://redis:6379"
      SCHOOL_JWT_SECRET: "xyratech-super-secure-school-jwt-secret-phase1-dev-test"
      APP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Frontend Applications
  # ----------------------------------------------------------------------------
  control-center:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        APP_PATH: apps/control-center
    container_name: xyratech-control-center
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_PLATFORM_API_URL: "http://localhost:4000/api/v1/platform"
    depends_on:
      - platform-api

  school-erp:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        APP_PATH: apps/school-erp
    container_name: xyratech-school-erp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      VITE_SCHOOL_API_URL: "http://localhost:5000/api/v1/school"
    depends_on:
      - school-api

  parent-student-portal:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        APP_PATH: apps/parent-student-portal
    container_name: xyratech-portal
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      VITE_SCHOOL_API_URL: "http://localhost:5000/api/v1/school"
    depends_on:
      - school-api

volumes:
  postgres_data:
  redis_data:
