services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xyratech_platform
    # Notice: Ports NOT exposed directly to host in production
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  platform-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.platform-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  school-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.school-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DEFAULT_SCHOOL_DATABASE_URL: ${DEFAULT_SCHOOL_DATABASE_URL}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SCHOOL_JWT_SECRET: ${SCHOOL_JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
